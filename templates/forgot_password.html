{% extends "base.html" %}
{% block title %}Reset password - IKEN Remote Lab{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card card">
    <h2>Reset your password</h2>
    <p class="tiny muted">Enter your email and we'll send a reset link. It's valid for 24 hours.</p>
    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-block">Send reset link</button>
    </form>
    <p class="center tiny muted" style="margin:1rem 0 0"><a href="{{ url_for('portal.home') }}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
