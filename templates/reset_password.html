{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card card">
    <h2>Choose a new password</h2>
    <form method="post">
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8" autofocus autocomplete="new-password">
        <div class="hint">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-block">Save new password</button>
    </form>
  </div>
</div>
{% endblock %}
